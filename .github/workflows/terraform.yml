name: Terraform CI

on:
  # Um PR que so toca markdown nao deveria exigir aprovacao de environment nem
  # um terraform plan. O PR #30, so com a auditoria em .md, ficou 44h em
  # `pending` travado no gate do environment `development` por causa disso.
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'utils/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'utils/**'
      - 'docker-compose.yml'
      - 'requirements.txt'

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.14.7"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-dev:
    name: "Terraform Dev"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    environment: development

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: terraform apply -auto-approve

  terraform-prod:
    name: "Terraform Prod"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    environment: production

    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
